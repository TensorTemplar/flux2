[project]
name = "flux"
version = "0.1.0"
description = "Inference codebase for FLUX.2"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Black Forest Labs", email = "support@blackforestlabs.ai" }
]
license = { file = "LICENSE.md" }

# Core dependencies for CLI remote mode (no CUDA required)
dependencies = [
  "click>=8.0.0",
  "httpx[http2]>=0.27.0",
  "pydantic-settings>=2.0.0",
  "Pillow>=10.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[project.scripts]
flux2-startup = "flux2.entrypoints.startup:main"
flux2-setup = "flux2.entrypoints.setup:main"
flux2-serve = "flux2.entrypoints.server:main"
flux2-text-encoder = "flux2.entrypoints.text_encoder_server:main"

[project.optional-dependencies]
# Local inference (requires CUDA)
inference = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "triton>=3.0.0",
  "torchao>=0.10.0",
  "einops==0.8.1",
  "transformers==4.56.1",
  "safetensors==0.4.5",
  "openai==2.8.1",
  "accelerate==1.12.0",
  "compressed-tensors>=0.13.0",
]
# Server dependencies (inference + FastAPI)
server = [
  "flux[inference]",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]
dev = [
  "flux[server]",
  "ruff==0.6.8",
  "pytest>=8.0.0",
  "pyrefly>=0.1.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
